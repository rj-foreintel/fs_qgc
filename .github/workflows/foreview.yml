# ForeView builds for Linux, Windows and Android.
#
# The upstream linux/windows/android workflows hard-code the QGroundControl
# binary and package names, so ForeView gets its own workflow built from the
# same composite actions. Each successful run publishes a GitHub pre-release
# with the AppImage, the Windows installer and the APK.
name: ForeView

on:
  push:
    branches:
      - 'foreview*'
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ForeView version shown in the app, installer and APK. Bump for each release.
  FOREVIEW_VERSION: 0.1.0
  IS_STABLE_BUILD: 'false'

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set ForeView version
        run: git tag -f "v${FOREVIEW_VERSION}"

      - name: Build Setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: Release

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          stable: ${{ env.IS_STABLE_BUILD }}

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Verify Executable
        uses: ./.github/actions/verify-executable
        with:
          binary-path: ${{ runner.temp }}/build/Release/ForeView

      - name: Create AppImage
        working-directory: ${{ runner.temp }}/build
        run: cmake --install . --config Release

      - name: Verify AppImage
        uses: ./.github/actions/verify-executable
        with:
          binary-path: ${{ runner.temp }}/build/ForeView-x86_64.AppImage
          type: appimage

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ForeView-linux
          path: ${{ runner.temp }}/build/ForeView-x86_64.AppImage
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set ForeView version
        shell: bash
        run: git tag -f "v${FOREVIEW_VERSION}"

      - name: Build Setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: windows
          qt-arch: win64_msvc2022_64
          build-type: Release

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          stable: ${{ env.IS_STABLE_BUILD }}
          extra-args: -DQGC_ENABLE_GST_VIDEOSTREAMING=ON

      - name: Add GStreamer to PATH
        shell: pwsh
        run: |
          $cacheFile = "${{ runner.temp }}\build\CMakeCache.txt"
          $match = Select-String -Path $cacheFile -Pattern '^GStreamer_ROOT_DIR:.*=(.+)$'
          if (-not $match) {
            Write-Error "GStreamer_ROOT_DIR not found in CMakeCache.txt"
            exit 1
          }
          "$($match.Matches[0].Groups[1].Value)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Verify Executable
        uses: ./.github/actions/verify-executable
        with:
          binary-path: ${{ runner.temp }}/build/Release/ForeView.exe
          type: exe
          build-dir: ${{ runner.temp }}/build

      - name: Create Installer
        working-directory: ${{ runner.temp }}\build
        run: cmake --install . --config Release

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ForeView-windows
          path: ${{ runner.temp }}/build/ForeView-installer-AMD64.exe
          if-no-files-found: error
          compression-level: 0

  android:
    name: Android (arm64-v8a, armeabi-v7a)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      QT_ANDROID_ABIS: arm64-v8a;armeabi-v7a
      QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/deploy/android/android_release.keystore
      QT_ANDROID_KEYSTORE_ALIAS: QGCAndroidKeyStore
      QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set ForeView version
        run: git tag -f "v${FOREVIEW_VERSION}"

      - name: Build Setup (Android)
        id: setup
        uses: ./.github/actions/build-setup
        with:
          mode: android
          qt-host: linux
          qt-arch: linux_gcc_64
          abis: ${{ env.QT_ANDROID_ABIS }}
          build-type: Release
          cpm-modules: ${{ runner.temp }}/build/cpm_modules

      - name: Install host build dependencies
        uses: ./.github/actions/install-dependencies

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create Debug Keystore
        if: ${{ env.QT_ANDROID_KEYSTORE_STORE_PASS == '' }}
        run: |
          keytool -genkey -v \
            -keystore "${RUNNER_TEMP}/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "QT_ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/debug.keystore"
            echo "QT_ANDROID_KEYSTORE_ALIAS=androiddebugkey"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=android"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=android"
          } >> "$GITHUB_ENV"

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          stable: ${{ env.IS_STABLE_BUILD }}
          use-qt-cmake: 'false'
          extra-args: >-
            -DCMAKE_WARN_DEPRECATED=FALSE
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup.outputs.target_qt_root_dir }}/lib/cmake/Qt6/qt.toolchain.cmake
            -DCMAKE_PREFIX_PATH=${{ steps.setup.outputs.target_qt_root_dir }}
            -DQT_ANDROID_ABIS=${{ env.QT_ANDROID_ABIS }}
            -DQT_HOST_PATH=${{ steps.setup.outputs.host_qt_root_dir }}
            -DQT_ANDROID_SIGN_APK=ON

      - name: Build
        timeout-minutes: 75
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Prepare APK
        run: |
          APK_DIR="${RUNNER_TEMP}/build/android-build"
          shopt -s nullglob
          apks=("${APK_DIR}"/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "::error::No APK found in ${APK_DIR}"
            ls -la "${APK_DIR}" || true
            exit 1
          fi
          cp "${apks[0]}" "${RUNNER_TEMP}/build/ForeView.apk"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ForeView-android
          path: ${{ runner.temp }}/build/ForeView.apk
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish pre-release
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: foreview-${{ env.FOREVIEW_VERSION }}-build${{ github.run_number }}
        run: |
          ls -la dist
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "ForeView ${FOREVIEW_VERSION} (build ${{ github.run_number }})" \
            --notes "Built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}. Linux AppImage, Windows installer and Android APK (arm64-v8a + armeabi-v7a)."
